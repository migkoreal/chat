<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Zg - Login/Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-box">
        <h1>Chat Zg</h1>

        <!-- Botões topo -->
        <div class="top-buttons">
            <button id="btnCadastro" class="active" onclick="mostrarForm('cadastro')">Cadastrar</button>
            <button id="btnLogin" onclick="mostrarForm('login')">Entrar</button>
        </div>

        <!-- Cadastro -->
        <div id="cadastro" class="form-box">
            <input type="text" id="cadNome" placeholder="Nome exibido">
            <input type="text" id="cadUsuario" placeholder="@usuario (sem espaços)">
            <input type="password" id="cadSenha" placeholder="Senha">
            <button onclick="cadastrar()">Cadastrar</button>
        </div>

        <!-- Login -->
        <div id="login" class="form-box" style="display:none;">
            <input type="text" id="loginUsuario" placeholder="@usuario">
            <input type="password" id="loginSenha" placeholder="Senha">
            <button onclick="logar()">Entrar</button>
        </div>

        <div id="mensagem"></div>
    </div>
</div>

<script>
function mostrarForm(form){
    const cadastro = document.getElementById('cadastro');
    const login = document.getElementById('login');
    const btnCadastro = document.getElementById('btnCadastro');
    const btnLogin = document.getElementById('btnLogin');

    if(form==='cadastro'){
        cadastro.style.display='block';
        login.style.display='none';
        btnCadastro.classList.add('active');
        btnLogin.classList.remove('active');
    } else {
        cadastro.style.display='none';
        login.style.display='block';
        btnCadastro.classList.remove('active');
        btnLogin.classList.add('active');
    }
}
</script>
</body>
  </html>
